# Root railway.toml
# This file is shared by all services in the monorepo.

[build]
# Default to auto-detection (Nixpacks or Dockerfile)

[deploy]
# Do not set global healthchecks here as some services are CLI tools.
# Individual services can define their own healthchecks if needed.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
